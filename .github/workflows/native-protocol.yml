name: Native USDC protocol checks
on:
  push:
    branches: [development/base-usdc]
  pull_request:
    paths: ['TacPredict/protocol/**', 'TacPredict/src/lib/protocol/**', 'TacPredict/supabase/migrations/**']
permissions:
  contents: read
jobs:
  local-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TacPredict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TacPredict/package-lock.json
      - run: npm ci
      - run: npm ci --prefix protocol
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm --prefix protocol run compile
      - run: node protocol/scripts/emit-pool-bytecode.mjs 0 10
        continue-on-error: true
      - run: node protocol/scripts/emit-pool-bytecode.mjs 10 10
        continue-on-error: true
      - run: node protocol/scripts/emit-pool-bytecode.mjs 20 10
        continue-on-error: true
      - run: npm --prefix protocol test
      - name: Show failing test output as annotations
        if: failure()
        run: node protocol/scripts/ci-annotate-test.mjs protocol/test/pool-artifact.test.mjs
# No secrets, wallet funding, deployment or mainnet activation in CI.
